<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CustardCash</title>
    <style>
        :root {
            --pale-yellow: #fbf5c4; 
            --light-brown: #a06b47; 
            --dark-brown: #4d2b1f;  
            --bright-yellow: #f1d54d; 
            --orange: #e89d46;      
        }

        body {
            background-color: var(--pale-yellow);
            color: var(--dark-brown);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h1 { font-size: 3rem; margin-bottom: 5px; }
        h2 { font-size: 1.5rem; margin-top: 20px; }

        .btn-group { margin-bottom: 20px; }

        button {
            background-color: var(--orange);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .weekly-btn { font-size: 1rem; padding: 10px 20px; background-color: transparent; color: var(--orange); border: 2px solid var(--orange); }
        .undo-btn { font-size: 0.9rem; padding: 10px 15px; background-color: var(--light-brown); margin-top: 15px; }

        #info-display {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--orange);
            min-height: 30px;
            margin-bottom: 15px;
        }

        /* Calendar Header & Nav */
        .calendar-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .nav-btn {
            background: none;
            border: none;
            color: var(--dark-brown);
            font-size: 2rem;
            padding: 0 15px;
            box-shadow: none;
        }

        /* Calendar Grid */
        .calendar-wrapper {
            max-width: 600px;
            margin: 0 auto;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--light-brown);
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-block {
            background-color: var(--light-brown);
            color: var(--pale-yellow);
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .day-block.empty {
            background-color: transparent;
            cursor: default;
        }

        .day-block:hover:not(.empty) { transform: scale(1.05); }
        .day-block.success { background-color: var(--bright-yellow); color: var(--dark-brown); }
    </style>
</head>
<body>

    <p>Total Savings</p>
    <h1 id="total-savings">0 ₱</h1>
    <h2 id="daily-target">Loading...</h2>
    
    <div class="btn-group">
        <button id="btn-done" onclick="logSavings('daily')">DONE</button><br>
        <button id="btn-weekly" class="weekly-btn" onclick="logSavings('weekly')">WEEKLY DROP</button><br>
        <button id="btn-undo" class="undo-btn" onclick="undoLast()">Undo Last Save</button>
    </div>

    <div id="info-display">Tap a colored day to see details</div>

    <div class="calendar-wrapper">
        <div class="calendar-header">
            <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>
            <span id="month-label">Month</span>
            <button class="nav-btn" onclick="changeMonth(1)">&#8250;</button>
        </div>
        <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="calendar" id="calendar-grid"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyuSSiVqzrht8cPNgKj-7B6xgtbL22_j5QfzYrqzPBeEj7RPFmycHxQcgYbRU5uFSw5/exec"; 
        
        let currentTotal = 0;
        let currentTarget = 200;
        let currentDayNumber = 1;
        let savedEntries = [];
        
        // Always wake up on the current real-world month
        let displayDate = new Date(); 

        async function loadData() {
            setLoading(true);
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                savedEntries = data.slice(1); 
                recalculateState();
                renderCalendar();
            } catch (error) {
                console.error("Error loading data", error);
                document.getElementById('info-display').innerText = "Failed to load database.";
            }
            setLoading(false);
        }

        function recalculateState() {
            currentTotal = 0;
            currentTarget = 200;
            currentDayNumber = savedEntries.length + 1;

            savedEntries.forEach(entry => {
                currentTotal += parseInt(entry[3]); 
                currentTarget -= 2;
                if (currentTarget < 0) currentTarget = 200; 
            });

            document.getElementById('total-savings').innerText = currentTotal.toLocaleString() + " ₱";
            document.getElementById('daily-target').innerText = "Today's Target: " + currentTarget + " ₱";
        }

        function changeMonth(offset) {
            displayDate.setMonth(displayDate.getMonth() + offset);
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = "";
            
            const year = displayDate.getFullYear();
            const month = displayDate.getMonth();
            
            document.getElementById('month-label').innerText = displayDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Pad empty blocks before the 1st of the month
            for (let i = 0; i < firstDay; i++) {
                let emptyDiv = document.createElement('div');
                emptyDiv.className = 'day-block empty';
                grid.appendChild(emptyDiv);
            }

            // Render actual days
            for (let day = 1; day <= daysInMonth; day++) {
                let blockDate = new Date(year, month, day);
                let fullDateStr = blockDate.toLocaleDateString();

                let div = document.createElement('div');
                div.className = 'day-block';
                div.innerText = day;

                let matchingSave = savedEntries.find(entry => new Date(entry[0]).toLocaleDateString() === fullDateStr);

                if (matchingSave) {
                    div.classList.add('success');
                    let amountSaved = matchingSave[3];
                    div.onclick = () => {
                        document.getElementById('info-display').innerText = `Saved ${amountSaved} ₱ on ${blockDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
                    };
                } else {
                    div.onclick = () => {
                        document.getElementById('info-display').innerText = `No savings on ${blockDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
                    };
                }
                grid.appendChild(div);
            }
        }

        async function logSavings(type) {
            setLoading(true);
            let payload = [];
            let loops = (type === 'weekly') ? 7 : 1;

            let tempTarget = currentTarget;
            let tempDayNum = currentDayNumber;
            let logDate = new Date();

            for (let i = 0; i < loops; i++) {
                let thisDate = new Date(logDate);
                if (i > 0) thisDate.setDate(logDate.getDate() + i); 
                
                payload.push({
                    date: thisDate.toLocaleDateString(),
                    dayNumber: tempDayNum,
                    targetAmount: tempTarget,
                    actualSaved: tempTarget,
                    status: "Success"
                });

                tempTarget -= 2;
                tempDayNum++;
                if (tempTarget < 0) tempTarget = 200; 
            }

            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "log", payload: payload })
                });
                await loadData(); 
                document.getElementById('info-display').innerText = "Savings Logged Successfully!";
            } catch (error) {
                console.error("Error saving data", error);
            }
            setLoading(false);
        }

        async function undoLast() {
            if (savedEntries.length === 0) return;
            if(!confirm("Are you sure you want to undo your last entry?")) return;

            setLoading(true);
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "undo" })
                });
                await loadData(); 
                document.getElementById('info-display').innerText = "Last entry removed.";
            } catch (error) {
                console.error("Error undoing data", error);
            }
            setLoading(false);
        }

        function setLoading(isLoading) {
            document.getElementById('btn-done').disabled = isLoading;
            document.getElementById('btn-weekly').disabled = isLoading;
            document.getElementById('btn-undo').disabled = isLoading;
        }

        loadData();
    </script>
</body>
</html>
